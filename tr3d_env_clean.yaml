name: tr3d
channels:
  - conda-forge
  - pytorch
  - defaults
dependencies:
  # Core Python - required by project
  - python=3.8
  
  # Essential build tools
  - pip
  - setuptools<70  # Compatible with PyTorch 1.12.1
  - wheel
  - cython
  
  # Install numpy via conda (needed for numba to build)
  - numpy=1.21.5
  
  # Install LLVM for numba/llvmlite
  - llvmdev
  
  # Install numba via conda (pre-built, avoids build issues)
  - numba=0.53.0
  
  # System libraries
  - openssl
  - ca-certificates
  - sqlite
  
  # NOTE: PyTorch is NOT included - install separately after environment creation
  # This avoids platform-specific issues. See POST_INSTALL.md for instructions.
  
  # All Python packages via pip
  - pip:
      # Core scientific stack
      - scipy==1.10.1
      - scikit-learn==1.3.2
      - scikit-image==0.19.3
      - pandas==2.0.3
      - matplotlib==3.5.2
      - pillow==10.4.0
      
      # TR3D project dependencies (from requirements/runtime.txt)
      - lyft-dataset-sdk==0.0.8
      - networkx>=2.2,<2.3
      # numba installed via conda above
      - plyfile==0.7.4
      - tensorboard==2.11.2
      - trimesh>=2.35.39,<2.35.40
      
      # Additional utilities
      - pyyaml==6.0.2
      - tqdm==4.67.1
      - pyquaternion==0.9.9
      - shapely==1.8.5
      - opencv-python==4.12.0.88
      - seaborn==0.13.2
      
      # NOTE: The following packages require PyTorch and are installed separately:
      # - mmcv-full==1.6.0
      # - mmdet==2.25.3
      # - mmengine==0.10.7
      # - mmsegmentation==0.24.1
      # - mmcls==0.25.0
      # - minkowskiengine==0.5.4
      # - open3d==0.18.0  (0.19.0 not available for all platforms)
      # See POST_INSTALL.md for installation instructions

